aid: svt-robotics
name: SVT Robotics
description: >-
  SVT Robotics builds the SOFTBOT Platform, a software integration and
  orchestration foundation for warehouse automation and the supply chain.
  Founded in 2018 and headquartered in Norfolk, Virginia, the company lets
  enterprises connect industrial systems, robotics, AMRs, and warehouse
  management software through standardized, prebuilt SOFTBOT Connectors —
  reducing integration complexity and enabling real-time visibility, faster
  automation deployments, and a resilient data backbone for automation and AI.
  Customers include DHL Supply Chain, Barrett Distribution Centers, and the
  Hagen Group. The provider operates a developer documentation hub for the
  SOFTBOT integration API (docs.svtrobotics.com, currently password-protected)
  and a public status page; no public OpenAPI, SDK, or open API surface was
  discoverable at enrichment time.
